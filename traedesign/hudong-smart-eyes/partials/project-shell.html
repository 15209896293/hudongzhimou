<!-- 护动智眸 - Project Shell (Partial Fragment) -->
<!-- This fragment provides the shared top navigation bar and main app frame structure.
     Leaf pages should wrap this fragment inside their own <html>/<head>/<body>. -->

<!-- ======================== Top Navigation Bar ======================== -->
<nav
  class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between h-[52px] px-6 border-b"
  style="background: var(--color-bg-elevated); border-color: var(--color-border);"
>
  <!-- Left: Brand Logo -->
  <div class="flex items-center gap-3">
    <div
      class="flex items-center justify-center rounded-full"
      style="width: 48px; height: 48px; background: var(--color-brand);"
    >
      <!-- Shield + Eye icon (inline SVG) -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 2L3 7v5c0 5.25 3.83 10.15 9 11.25C17.17 22.15 21 17.25 21 12V7l-9-5z" fill="none"/>
        <path d="M12 9a3 3 0 0 1 0 6 3 3 0 0 1 0-6z" fill="none"/>
        <path d="M2 12s3-4 10-4 10 4 10 4-3 4-10 4-10-4-10-4z" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span
      class="text-[20px] font-semibold select-none"
      style="color: var(--color-text-primary); font-weight: 600;"
    >
      护动智眸
    </span>
  </div>

  <!-- Center: Mode Tab Pills -->
  <div
    class="flex items-center gap-1 p-1 rounded-full"
    style="background: var(--color-bg-sunken);"
    data-tab-group="main-tabs"
  >
    <!-- 运动训练 (active) -->
    <button
      class="px-4 py-1.5 text-[13px] font-medium rounded-full transition-colors duration-150"
      style="background: var(--color-brand); color: var(--color-text-inverse);"
      data-dom-id="nav-training"
      data-active="true"
    >
      运动训练
    </button>
    <!-- 统计分析 -->
    <button
      class="px-4 py-1.5 text-[13px] font-medium rounded-full transition-colors duration-150"
      style="background: var(--color-bg-inset); color: var(--color-text-primary);"
      data-dom-id="nav-stats"
    >
      统计分析
    </button>
  </div>

  <!-- Right: User Avatar + Settings -->
  <div class="flex items-center gap-3">
    <!-- User Avatar -->
    <div
      class="flex items-center justify-center rounded-full"
      style="width: 32px; height: 32px; background: var(--color-border);"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#AEAEB2"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="8" r="4"/>
        <path d="M5 20c0-3.87 3.13-7 7-7s7 3.13 7 7"/>
      </svg>
    </div>
    <!-- Settings / Gear Icon -->
    <button
      class="flex items-center justify-center rounded-full cursor-pointer hover:bg-[var(--color-bg-sunken)] transition-colors duration-150"
      style="width: 32px; height: 32px;"
      aria-label="Settings"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#86868B"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</nav>

<!-- ======================== Main Content Frame ======================== -->
<main
  class="w-full min-h-screen"
  style="padding-top: 52px; padding-left: 24px; padding-right: 24px; padding-bottom: 24px; background: var(--color-bg);"
>
  <!-- SLOT: mainContent -->
</main>
