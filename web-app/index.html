<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>护动智眸 — 运动健身防伤评估</title>
  <meta name="description" content="基于浏览器实时姿态识别的运动健身防伤评估系统，以 FMS 功能性运动筛查为核心。">
  <meta name="theme-color" content="#007AFF">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.tailwindcss.com; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="护动智眸">
  <link rel="manifest" href="manifest.json">
  <!-- Google Fonts: Noto Sans CJK SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <!-- 运行时配置（必须在 ES Modules 之前加载） -->
  <script src="js/config.js"></script>
</head>
<body>
  <!-- ===== 侧边栏导航（桌面） / 底部 Tab（移动端） ===== -->
  <nav id="nav" class="nav-bar">
    <div class="nav-brand">
      <span class="nav-logo">护动智眸</span>
      <span class="nav-subtitle">运动健身防伤评估</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="training">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        训练
      </button>
      <button class="nav-tab" data-page="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H5a2 2 0 00-2 2v7h6V11z"/><path d="M15 7h-6v13h6V7z"/><path d="M21 3h-6v17h6V3z"/></svg>
        报告
      </button>
      <button class="nav-tab" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6m11-11h-6M7 12H1m17.4-7.4l-4.2 4.2m-4.4 4.4l-4.2 4.2m12.8 0l-4.2-4.2M9.4 9.4L5.2 5.2"/></svg>
        设置
      </button>
    </div>
    <div class="nav-status">
      <span id="nav-username" class="nav-username"></span>
      <button id="nav-login-btn" class="btn btn-ghost btn-sm">登录</button>
    </div>
  </nav>

  <!-- ===== 主容器 ===== -->
  <main id="app" class="app-main">

    <!-- ===== 训练页 ===== -->
    <section id="page-training" class="page active">
      <!-- 顶部状态栏 -->
      <div class="training-topbar">
        <div class="training-breadcrumb">训练 / <strong>FMS 功能性筛查</strong></div>
        <div class="training-topbar-right">
          <span><span class="status-dot"></span>模型就绪</span>
        </div>
      </div>

      <!-- 三栏工作区 -->
      <div class="training-workspace">
        <!-- 左栏：控制面板 -->
        <div class="control-panel">
          <div>
            <div class="panel-label">模式</div>
            <div class="mode-switcher">
              <button class="mode-btn active" data-mode="fms">FMS 筛查</button>
              <button class="mode-btn" data-mode="training">训练模式</button>
            </div>
          </div>

          <div class="test-selector fms-only">
            <div class="panel-label">筛查动作</div>
            <select id="fms-test-select" class="select">
              <option value="deep_squat">深蹲 (Deep Squat)</option>
              <option value="hurdle_step">跨栏步 (Hurdle Step)</option>
              <option value="inline_lunge">直线弓步 (In-Line Lunge)</option>
              <option value="shoulder_mobility">肩关节灵活性 (Shoulder Mobility)</option>
              <option value="aslr">主动直腿抬高 (ASLR)</option>
              <option value="trunk_stability">躯干稳定性俯卧撑</option>
              <option value="rotary_stability">旋转稳定性</option>
            </select>
          </div>
          <div class="test-selector training-only" style="display:none">
            <div class="panel-label">训练动作</div>
            <select id="exercise-select" class="select"></select>
          </div>

          <div class="training-controls fms-only">
            <div class="panel-label">控制</div>
            <button id="btn-start" class="btn btn-primary">开始检测</button>
            <button id="btn-stop" class="btn btn-secondary" disabled>停止</button>
            <button id="btn-snapshot" class="btn btn-ghost" disabled>记录评分</button>
          </div>
          <div class="training-controls training-only" style="display:none">
            <div class="panel-label">控制</div>
            <button id="btn-train-start" class="btn btn-primary">开始训练</button>
            <button id="btn-train-pause" class="btn btn-secondary" disabled>暂停</button>
            <button id="btn-train-stop" class="btn btn-ghost" disabled>结束</button>
          </div>
        </div>

        <!-- 中栏：摄像头区 -->
        <div class="camera-area">
          <div class="camera-container">
            <video id="camera-video" autoplay playsinline muted></video>
            <canvas id="skeleton-canvas"></canvas>
            <div id="risk-indicator"></div>
            <div id="fps-display" style="display:none">FPS: 0</div>
            <div id="loading-overlay" class="loading-overlay" style="display:none">
              <div class="spinner"></div>
              <p id="loading-text">正在加载姿态识别模型…</p>
            </div>
            <div id="camera-error" class="camera-error" style="display:none"></div>
          </div>
        </div>

        <!-- 右栏：数据面板 -->
        <div class="data-panel">
          <div class="drawer-handle"></div>
          <div class="data-panel-content">
            <!-- FMS 模式面板 -->
            <div class="card fms-score-card fms-only">
              <h3 class="card-title">当前评分</h3>
              <div class="score-display">
                <span id="fms-score" class="score-number">--</span>
                <span class="score-max">/ 3</span>
              </div>
              <div id="fms-score-bar" class="score-bar">
                <div class="score-bar-fill"></div>
              </div>
              <div id="fms-issues" class="issues-list"></div>
            </div>

            <div class="card angles-card fms-only">
              <h3 class="card-title">关节角度</h3>
              <div id="angles-list" class="angles-list">
                <p class="empty-hint">开始检测后显示</p>
              </div>
            </div>

            <div class="card alerts-card fms-only">
              <h3 class="card-title">风险预警</h3>
              <div id="alerts-list" class="alerts-list">
                <p class="empty-hint">开始检测后显示</p>
              </div>
            </div>

            <!-- 训练模式面板 -->
            <div class="card train-stats-card training-only" style="display:none">
              <h3 class="card-title">训练数据</h3>
              <div class="train-metrics">
                <div class="train-metric">
                  <span class="train-metric-label">计时</span>
                  <span id="train-duration" class="train-metric-value">00:00</span>
                </div>
                <div class="train-metric">
                  <span class="train-metric-label">次数</span>
                  <span id="train-reps" class="train-metric-value">0</span>
                </div>
                <div class="train-metric">
                  <span class="train-metric-label">阶段</span>
                  <span id="train-stage" class="train-metric-value">--</span>
                </div>
              </div>
            </div>

            <div class="card train-quality-card training-only" style="display:none">
              <h3 class="card-title">动作质量</h3>
              <div class="score-display">
                <span id="train-quality" class="score-number">--</span>
                <span class="score-max">/ 100</span>
              </div>
              <div class="score-bar">
                <div id="train-quality-bar" class="score-bar-fill"></div>
              </div>
              <div id="train-quality-breakdown" class="issues-list">
                <p class="empty-hint">开始训练后显示</p>
              </div>
            </div>

            <div class="card train-alerts-card training-only" style="display:none">
              <h3 class="card-title">安全预警</h3>
              <div id="train-alerts" class="alerts-list">
                <p class="empty-hint">开始训练后显示</p>
              </div>
              <div class="train-fatigue-row">
                <span class="field-label">疲劳状态</span>
                <span id="train-fatigue" class="fatigue-badge">--</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 报告页 ===== -->
    <section id="page-report" class="page">
      <div id="report-content" class="report-grid">
        <div class="card report-empty">
          <p class="empty-hint">完成一次 FMS 筛查后，此处将展示评分报告</p>
        </div>
      </div>
      <div id="stats-content" class="stats-container" style="display:none"></div>
    </section>

    <!-- ===== 设置页 ===== -->
    <section id="page-settings" class="page">
      <div class="settings-container">
        <div class="card settings-card">
          <h3 class="card-title">用户信息</h3>
          <div class="settings-form">
            <div class="form-row">
              <label class="field-label" for="set-nickname">昵称</label>
              <input type="text" id="set-nickname" class="input" placeholder="未设置">
            </div>
            <div class="form-row">
              <label class="field-label" for="set-gender">性别</label>
              <select id="set-gender" class="select">
                <option value="">未设置</option>
                <option value="male">男</option>
                <option value="female">女</option>
              </select>
            </div>
            <div class="form-row">
              <label class="field-label" for="set-height">身高 (cm)</label>
              <input type="number" id="set-height" class="input" placeholder="如 175">
            </div>
            <div class="form-row">
              <label class="field-label" for="set-weight">体重 (kg)</label>
              <input type="number" id="set-weight" class="input" placeholder="如 70">
            </div>
            <div class="form-row">
              <label class="field-label" for="set-age">年龄</label>
              <input type="number" id="set-age" class="input" placeholder="如 20">
            </div>
            <div class="form-row">
              <label class="field-label" for="set-injury">伤病历史</label>
              <textarea id="set-injury" class="input textarea" placeholder="如：左膝关节半月板损伤史"></textarea>
            </div>
            <button id="btn-save-profile" class="btn btn-primary">保存信息</button>
          </div>
        </div>

        <div class="card settings-card">
          <h3 class="card-title">摄像头设置</h3>
          <div class="settings-form">
            <div class="form-row">
              <label class="field-label" for="set-camera">摄像头设备</label>
              <select id="set-camera" class="select">
                <option value="">默认摄像头</option>
              </select>
            </div>
            <div class="form-row">
              <label class="field-label" for="set-mirror">镜像画面</label>
              <label class="switch">
                <input type="checkbox" id="set-mirror" checked>
                <span class="switch-slider"></span>
              </label>
            </div>
            <button id="btn-refresh-cameras" class="btn btn-secondary btn-sm">刷新设备列表</button>
          </div>
        </div>

        <div class="card settings-card">
          <h3 class="card-title">模型与性能</h3>
          <div class="settings-form">
            <div class="form-row">
              <label class="field-label" for="set-model">识别精度</label>
              <select id="set-model" class="select">
                <option value="lite">Lite（快，推荐）</option>
                <option value="full">Full（精确，较慢）</option>
                <option value="heavy">Heavy（最精确，最慢）</option>
              </select>
            </div>
            <div class="form-row">
              <label class="field-label" for="set-fps">目标帧率上限</label>
              <select id="set-fps" class="select">
                <option value="60">60 FPS</option>
                <option value="30">30 FPS</option>
                <option value="15">15 FPS（省电）</option>
              </select>
            </div>
            <p class="settings-tip">低配设备若卡顿，请选择 Lite 精度并降低帧率。</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
